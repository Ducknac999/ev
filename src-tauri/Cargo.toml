[package]
name = "ev"
version = "1.0.5"
description = "Multi-chat desktop workspace"
edition = "2021"

[lib]
name = "ev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "fs", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
portable-pty = "0.9"
vt100 = "0.15"
libc = "0.2"
sha2 = "0.10"
chacha20poly1305 = "0.10"
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
tauri-plugin-global-shortcut = "2"
sherpa-onnx = "1.13.8"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
sonora = "0.2"
cpal = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
